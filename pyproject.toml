[project]
name = "insurance-claims-agent-team"
version = "0.1.0"
description = "Production-style multi-agent insurance claims processing system"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "langgraph>=0.2.0",
    "gradio>=4.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agents", "core", "ui", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
